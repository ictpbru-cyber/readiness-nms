<head>
  <script src="js/anychart-bundle.min.js"></script>
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
    <div id="container"></div>
    <script type="text/javascript">
anychart.onDocumentReady(function() {
  // create line chart
  chart = anychart.line();

  // turn on chart animation
  chart.animation(true);

  // set container for the chart
  chart.container('container');

  // set chart title text settings
  chart.title().text('Line chart with Logarithmic Y-Axis and Data Labels');

  // create logarithmic scale
  var logScale = anychart.scales.log();
  logScale.minimum(1);

  // set scale for the chart, this scale will be used in all scale dependent entries such axes, grids, etc
  chart.yScale(logScale);

  // create first series with mapped data
  var series = chart.line([
    ['P1', '112.61 '],
    ['P2', '163.21 '],
    ['P3', '229.98 '],
    ['P4', '2790.54'],
    ['P5', '4104.19'],
    ['P6', '3250.67'],
    ['P7', '5720.43'],
    ['P8', '43.76'],
    ['P9', '61.34'],
    ['P10', '34.17'],
    ['P11', '45.72'],
    ['P12', '122.56 '],
    ['P13', '87.12'],
    ['P14', '54.32'],
    ['P15', '33.08'],
	['P16', '35.99']
  ]);

  // enable series data labels
  series.labels()
      .enabled(true)
      .anchor('bottom')
      .fontWeight('bold');

  // initiate chart drawing
  chart.draw();
});
    </script>
</body>
</html>
