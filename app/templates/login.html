{% extends "base.html" %}

{% block title %}Login | {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4 col-sm-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex p-3 text-primary mb-2">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h4 class="fw-bold">Sign In</h4>
                    <p class="text-muted small">Readiness NMS Management Portal</p>
                </div>

                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right"></i> Log In
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 small text-muted text-center border">
                    <i class="bi bi-info-circle"></i> Default Administrator: <code>admin</code> / <code>admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
